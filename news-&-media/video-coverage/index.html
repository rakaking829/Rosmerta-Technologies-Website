   <script>
function showTab(tab) {
  document.querySelectorAll(".tab-content-new").forEach(c => c.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));

  document.getElementById(tab).classList.add("active");
  document.getElementById(tab + "Btn").classList.add("active");
}

// Auto-move past events with sorting
function movePastEvents() {
  const today = new Date();
  const pastContainer = document.getElementById("pastEvents");
  let pastEvents = [];

  document.querySelectorAll("#upcomingEvents .events-col").forEach(eventCol => {
    const dateText = eventCol.querySelector(".event-date p").innerText.trim();

    // Match ranges like "September 05-06, 2025" or single "September 09, 2025"
    const match = dateText.match(/([A-Za-z]+)\s+(\d{1,2})(?:-(\d{1,2}))?,\s*(\d{4})/);
    if (match) {
      const [_, month, startDay, endDay, year] = match;
      const eventDay = endDay ? endDay : startDay; // take last day if range
      const eventDate = new Date(`${month} ${eventDay}, ${year}`);

      if (eventDate < today) {
        pastEvents.push({ col: eventCol, date: eventDate });
      }
    }
  });

  // Sort past events (latest past first)
  pastEvents.sort((a, b) => b.date - a.date);

  // Append sorted past events
  pastEvents.forEach(ev => {
    pastContainer.appendChild(ev.col);
  });

  if (pastEvents.length > 0) {
    document.getElementById("noPastEvents").style.display = "none";
  }
}

document.addEventListener("DOMContentLoaded", movePastEvents);
</script>
